{% for file in site.static_files %}
    {% if file.path contains 'assets/videos/' %}
        {% if file.extname == '.mov' or file.extname == '.mp4' or file.extname == '.ogg' or file.extname == '.webm' %}
        <script>
            document.querySelector('.iphoneScreen')?.classList.add('hidden');
            document.querySelector('.videoContainer').classList.remove('hidden');
            var source = document.createElement('source');
            source.src = {{ file.path | relative_url | jsonify }};
            document.querySelector('.screenvideo').appendChild(source);
        </script>
        {% endif %}
    {% endif %}
{% endfor %}
